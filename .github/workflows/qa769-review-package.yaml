name: Package reviewed Connect 769 evidence
on:
  push:
    branches: [qa/769-review-package]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified evidence and assemble review
        env:
          QA769_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/qa769-review-package.py
      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: connect-769-reviewed-package-${{ github.run_id }}
          path: review-output/
          if-no-files-found: error
          retention-days: 90
