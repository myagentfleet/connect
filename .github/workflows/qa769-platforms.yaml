# Isolated media diagnostics; collection success is not application acceptance.
name: qa769-stock-safari-reference

on:
  push:
    branches: [qa/769-platforms]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  safari:
    if: github.ref == 'refs/heads/qa/769-platforms'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      QA_CANDIDATE_SHA: 8276cd68b3ac31da150fc8b4566fb29e479e2f65
      QA769_OUTPUT: ${{ github.workspace }}/results/safari-reference
      QA769_AUDIO_VARIANT_DIR: ${{ github.workspace }}/results/safari-reference/video-only
    defaults:
      run:
        shell: bash
        working-directory: application
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact application revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_CANDIDATE_SHA }}
          path: application
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Record source identity and copy diagnostic runner
        run: |
          test "$(git rev-parse HEAD)" = "$QA_CANDIDATE_SHA"
          mkdir -p "$QA769_OUTPUT"
          git rev-parse HEAD > "$QA769_OUTPUT/source-sha.txt"
          cp ../harness/scripts/qa769-safari-reference.mjs scripts/qa769-safari-reference.mjs
      - name: Install frozen application dependencies
        run: bun install --frozen-lockfile 2>&1 | tee "$QA769_OUTPUT/install.log"
      - name: Install FFmpeg for independently verified media transformation
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Generate and verify packet-preserving video-only media
        run: python3 ../harness/scripts/qa769-video-only.py --source public/demo-video --output "$QA769_AUDIO_VARIANT_DIR" 2>&1 | tee "$QA769_OUTPUT/fixture-verification.log"
      - name: Collect stock Safari with the pre-enabled system driver
        run: node scripts/qa769-safari-reference.mjs 2>&1 | tee "$QA769_OUTPUT/safari-reference.log"
      - name: Upload every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa769-stock-safari-${{ github.run_id }}
          path: results/safari-reference
          if-no-files-found: warn
          retention-days: 7
