# Native HLS diagnostics with synthetic and explicitly public production media.
name: qa769-production-native-reference

on:
  push:
    branches: [qa/769-platforms]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  safari:
    if: github.ref == 'refs/heads/qa/769-platforms'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      QA_CANDIDATE_SHA: 2d3bca154c33b09416f9826fad113863adb25946
      QA769_OUTPUT: ${{ github.workspace }}/results/production-native
    defaults:
      run:
        shell: bash
        working-directory: application
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact application revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_CANDIDATE_SHA }}
          path: application
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Record source identity and copy diagnostic scripts
        run: |
          test "$(git rev-parse HEAD)" = "$QA_CANDIDATE_SHA"
          mkdir -p "$QA769_OUTPUT"
          git rev-parse HEAD > "$QA769_OUTPUT/source-sha.txt"
          cp ../harness/scripts/qa769-safari-production.mjs scripts/qa769-safari-production.mjs
          cp ../harness/scripts/qa769-public-qcamera.mjs scripts/qa769-public-qcamera.mjs
      - name: Install frozen application dependencies
        run: bun install --frozen-lockfile 2>&1 | tee "$QA769_OUTPUT/install.log"
      - name: Install FFmpeg for reference-frame decoding
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Compare native playback using the pre-enabled stock Safari driver
        run: node scripts/qa769-safari-production.mjs 2>&1 | tee "$QA769_OUTPUT/production-native.log"
      - name: Upload every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa769-production-native-${{ github.run_id }}
          path: results/production-native
          if-no-files-found: warn
          retention-days: 7
