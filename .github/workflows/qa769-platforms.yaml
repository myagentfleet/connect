# Diagnostic only: cross source revisions with unchanged harnesses to isolate startup behavior.
name: qa769-platforms-cross

on:
  push:
    branches: [qa/769-platforms]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-cross:
    if: github.ref == 'refs/heads/qa/769-platforms'
    name: Diagnostic desktop WebKit (${{ matrix.profile }})
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: source-8eaa650-harness-current
            source: 8eaa650615151569cb00eba21c79e167e969d9e6
            script: qa769-platforms.mjs
            script_blob: a095b00ed515b20bf93377bde08244c5ba014135
            original_commit: ''
          - profile: source-ff8654b-harness-original-61d6
            source: ff8654bd8faf4e9b4de121bb1b188a7be7e1e745
            script: qa769-platforms-original.mjs
            script_blob: cb3f342fea55f782ca6f4cde176e6b6f36f5f065
            original_commit: 61d6fbd7a9658643154e4fa441826a34b243d7ea
    env:
      EXPECTED_SOURCE_SHA: ${{ matrix.source }}
      SELECTED_SCRIPT: ${{ matrix.script }}
      EXPECTED_SCRIPT_BLOB: ${{ matrix.script_blob }}
      ORIGINAL_HARNESS_COMMIT: ${{ matrix.original_commit }}
      DIAGNOSTIC_PROFILE: ${{ matrix.profile }}
      QA769_ENGINE: webkit
      QA769_NATIVE_PROFILE: 'false'
      QA769_CASE: controls-and-decoded-playback
      QA769_DIAGNOSTIC_ONLY: 'true'
      QA769_OUTPUT: ${{ github.workspace }}/results/${{ matrix.profile }}
      QA769_FIXTURES: ${{ github.workspace }}/application/public/demo-video
      VITE_POSTHOG_KEY: ''
      VITE_POSTHOG_HOST: ''
      E2E: 'true'
    defaults:
      run:
        shell: bash
        working-directory: application
    steps:
      - name: Checkout published validation harnesses
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact application revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: application
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify and record source, harness, fixture and runner identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git hash-object "../harness/scripts/$SELECTED_SCRIPT")" = "$EXPECTED_SCRIPT_BLOB"
          mkdir -p "$QA769_OUTPUT"
          git rev-parse HEAD > "$QA769_OUTPUT/source-sha.txt"
          git -C ../harness rev-parse HEAD > "$QA769_OUTPUT/harness-commit.txt"
          git hash-object "../harness/scripts/$SELECTED_SCRIPT" > "$QA769_OUTPUT/harness-script-blob.txt"
          sw_vers > "$QA769_OUTPUT/runner-os.txt"
          echo "QA_CANDIDATE_SHA=$EXPECTED_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "VITE_APP_GIT_SHA=$EXPECTED_SOURCE_SHA" >> "$GITHUB_ENV"
          cp "../harness/scripts/$SELECTED_SCRIPT" scripts/qa769-platforms.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const output = process.env.QA769_OUTPUT;
          const fixtures = process.env.QA769_FIXTURES;
          const hashes = {};
          function visit(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true }).sort((a, b) => a.name.localeCompare(b.name))) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(file);
              else hashes[path.relative(fixtures, file)] = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            }
          }
          visit(fixtures);
          const provenance = {
            diagnosticOnly: true,
            description: 'Bounded source-by-harness comparison, not complete acceptance. Original harness does not read QA769_DIAGNOSTIC_ONLY; this workflow and provenance label both jobs diagnostic.',
            profile: process.env.DIAGNOSTIC_PROFILE,
            applicationSha: fs.readFileSync(path.join(output, 'source-sha.txt'), 'utf8').trim(),
            harnessCommit: fs.readFileSync(path.join(output, 'harness-commit.txt'), 'utf8').trim(),
            harnessScript: process.env.SELECTED_SCRIPT,
            harnessScriptBlob: fs.readFileSync(path.join(output, 'harness-script-blob.txt'), 'utf8').trim(),
            originalHarnessCommit: process.env.ORIGINAL_HARNESS_COMMIT || null,
            runnerImageVersion: process.env.ImageVersion || null,
            runnerImageOS: process.env.ImageOS || null,
            runnerOS: process.env.RUNNER_OS,
            runnerArchitecture: process.env.RUNNER_ARCH,
            swVers: fs.readFileSync(path.join(output, 'runner-os.txt'), 'utf8'),
            node: process.version,
            playwright: '1.64.0', bun: '1.3.14', engine: 'webkit', headed: true,
            fixtureSha256: hashes,
          };
          fs.writeFileSync(path.join(output, 'provenance.json'), JSON.stringify(provenance, null, 2));
          console.log(JSON.stringify(provenance, null, 2));
          NODE
      - name: Install frozen application dependencies
        run: bun install --frozen-lockfile 2>&1 | tee "$QA769_OUTPUT/install.log"
      - name: Install the same pinned Playwright and WebKit
        run: |
          bun add --no-save playwright@1.64.0 2>&1 | tee "$QA769_OUTPUT/browser-tools.log"
          npx --no-install playwright install --with-deps webkit 2>&1 | tee "$QA769_OUTPUT/browser-install.log"
      - name: Run unchanged controls assertion in headed desktop WebKit
        run: node scripts/qa769-platforms.mjs 2>&1 | tee "$QA769_OUTPUT/browser.log"
      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa769-cross-${{ matrix.profile }}-${{ github.run_id }}
          path: results/${{ matrix.profile }}
          if-no-files-found: warn
          retention-days: 7
