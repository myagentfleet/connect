# Validation only: a separate branch, with the application pinned independently.
name: qa769-platforms

on:
  push:
    branches: [qa/769-platforms]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platforms:
    if: github.ref == 'refs/heads/qa/769-platforms'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: firefox-linux
            os: ubuntu-latest
            engine: firefox
            native: 'false'
            cases: ''
            diagnostic: 'false'
          - profile: webkit-macos
            os: macos-15
            engine: webkit
            native: 'false'
            cases: ''
            diagnostic: 'false'
          - profile: webkit-macos-iphone-emulation
            os: macos-15
            engine: webkit
            native: 'true'
            cases: controls-and-decoded-playback,healthy-loop,loading-and-navigation-cancellation,native-gap-observations,native-manifest-error-and-repaired-retry
            diagnostic: 'true'
    env:
      FINAL_CANDIDATE_SHA: ff8654bd8faf4e9b4de121bb1b188a7be7e1e745
      QA769_ENGINE: ${{ matrix.engine }}
      QA769_NATIVE_PROFILE: ${{ matrix.native }}
      QA769_CASE: ${{ matrix.cases }}
      QA769_DIAGNOSTIC_ONLY: ${{ matrix.diagnostic }}
      QA769_OUTPUT: ${{ github.workspace }}/results/${{ matrix.profile }}
      QA769_FIXTURES: ${{ github.workspace }}/application/public/demo-video
      VITE_POSTHOG_KEY: ''
      VITE_POSTHOG_HOST: ''
      E2E: 'true'
    defaults:
      run:
        shell: bash
        working-directory: application
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact application revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_CANDIDATE_SHA }}
          path: application
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Record source identity and copy validation script
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_CANDIDATE_SHA"
          mkdir -p "$QA769_OUTPUT"
          git rev-parse HEAD > "$QA769_OUTPUT/source-sha.txt"
          echo "QA_CANDIDATE_SHA=$FINAL_CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "VITE_APP_GIT_SHA=$FINAL_CANDIDATE_SHA" >> "$GITHUB_ENV"
          cp ../harness/scripts/qa769-platforms.mjs scripts/qa769-platforms.mjs
      - name: Install frozen application dependencies
        run: bun install --frozen-lockfile 2>&1 | tee "$QA769_OUTPUT/install.log"
      - name: Install pinned Playwright and browser with normal system dependencies
        run: |
          bun add --no-save playwright@1.64.0 2>&1 | tee "$QA769_OUTPUT/browser-tools.log"
          npx --no-install playwright install --with-deps "$QA769_ENGINE" 2>&1 | tee "$QA769_OUTPUT/browser-install.log"
      - name: Exercise real headed browser engine
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/qa769-platforms.mjs 2>&1 | tee "$QA769_OUTPUT/browser.log"
          else
            node scripts/qa769-platforms.mjs 2>&1 | tee "$QA769_OUTPUT/browser.log"
          fi
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa769-platforms-${{ matrix.profile }}-${{ github.run_id }}
          path: results/${{ matrix.profile }}
          if-no-files-found: warn
          retention-days: 7
