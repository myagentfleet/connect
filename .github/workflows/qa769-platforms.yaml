# A separate diagnostic branch; this workflow makes no application acceptance claim.
name: qa769-reference

on:
  push:
    branches: [qa/769-platforms]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    if: github.ref == 'refs/heads/qa/769-platforms'
    runs-on: macos-15
    timeout-minutes: 18
    env:
      QA_CANDIDATE_SHA: 78a13db35e4c7f9aa1e90e03bcf3dc1793c051b9
      QA769_OUTPUT: ${{ github.workspace }}/results/reference
    defaults:
      run:
        shell: bash
        working-directory: application
    steps:
      - name: Checkout reference harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact media and dependency revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_CANDIDATE_SHA }}
          path: application
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Record source and copy diagnostic script
        run: |
          test "$(git rev-parse HEAD)" = "$QA_CANDIDATE_SHA"
          mkdir -p "$QA769_OUTPUT"
          git rev-parse HEAD > "$QA769_OUTPUT/source-sha.txt"
          cp ../harness/scripts/qa769-reference.mjs scripts/qa769-reference.mjs
      - name: Install frozen application dependencies
        run: bun install --frozen-lockfile 2>&1 | tee "$QA769_OUTPUT/install.log"
      - name: Install pinned Playwright and normal WebKit
        run: |
          bun add --no-save playwright@1.64.0 2>&1 | tee "$QA769_OUTPUT/browser-tools.log"
          npx --no-install playwright install --with-deps webkit 2>&1 | tee "$QA769_OUTPUT/browser-install.log"
      - name: Collect paired reference observations
        run: node scripts/qa769-reference.mjs 2>&1 | tee "$QA769_OUTPUT/reference.log"
      - name: Upload every reference outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa769-reference-${{ github.run_id }}
          path: results/reference
          if-no-files-found: warn
          retention-days: 7
